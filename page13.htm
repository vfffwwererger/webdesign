<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>css list</title>
		<style>
			ul{
				/*list-style-image: url('imgs/pic03.gif');*/
				list-style-type: square;
			}
			ol{
				list-style-type: upper-roman;
			}
			.noicon{list-style-type: none;}
		</style>

	</head>
	<body>
		<h2>css list</h2>
		
		<ul>
			<li>coffee</li>
			<li>tea</li>
			<li>milk</li>
			<li>juice</li>
			<li>water</li>
		</ul>

		<ul class="noicon">
			<li>coffee</li>
			<li>tea</li>
			<li>milk</li>
			<li>juice</li>
			<li>water</li>
		</ul>

		<ol>
			<li>coffee</li>
			<li>tea</li>
			<li>milk</li>
			<li>juice</li>
			<li>water</li>
		</ol>
		<p><a href="index.htm">回首頁</a></p>	
	</body>
</html>
