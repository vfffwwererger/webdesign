<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>css button</title>
		<style>
			.btn01{width: 100px;height: 30px;color: white;background: green;text-align: center;font-size: 1rem;padding: 5px;margin: 5px;border-radius: 5px;}
			.btn01:hover{color: black;background: lightpink;box-shadow: 3px 3px 5px #ccc}
		</style>

	</head>
	<body>
		<h2>css button</h2>

		<button class="btn01">button按鈕</button>
		<input class="btn01" type="button" value="input按鈕">
		<div class="btn01">div按鈕</div>
		<p class="btn01">p按鈕</p>

		<p><a href="index.htm">回首頁</a></p>	
	</body>
</html>
