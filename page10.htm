<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>css box model</title>
		<style>
			.text-green{color: green}
			#header{background: lightcoral;width: 400px;height: 60px;}
			#menu{background: lightblue;width: 100px;height: 200px;float: left;}
			#content{background: lightcyan;width: 300px;height: 200px;float: left;}
			#ad1{width: 100%;height: 40px;}
			#news{background: lavender;width: 180px;height: 140px;float: left; padding: 10px;}
			#ad2{background: lightpink;width: 100px;height: 160px;float: left;}
			#logo{background-image: url("imgs/yahoo.png");background-size: contain; width: 100px;height: 30px;float: left;margin: 10px}
			#city{width: 100px;float: left; padding: 10px;}
		</style>

	</head>
	<body>
		<h2>css box model</h2>
		<div class="text-green" id="header">
			<div id="logo"></div>
			<div id="city">台北市28度</div>
		</div>
		<div class="text-green" id="menu">
			<ul>
				<li>新聞</li>
				<li>股市</li>
				<li>運動</li>
				<li>購物</li>
				<li>天氣</li>
			</ul>
		</div>
		<div class="text-green" id="content">
			<div id="ad1">ad1</div>
			<div id="news">新冠疫情持續升溫，本季疫情從去年10月至8月10日，全國累計337例本土新冠併發重症病例，</div>
			<div id="ad2">ad2</div>
		</div>
		<div style="clear: both;"></div>
		<p><a href="index.htm">回首頁</a></p>	
	</body>
</html>
